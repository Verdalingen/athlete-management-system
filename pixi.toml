[workspace]
name = "athlete-management-system"
version = "2.2.0"
description = "Closed-loop training system: Garmin ingest, multi-agent planning, structured workout delivery"
authors = ["Adrian Walderhaug-Johnsen"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.13.0,<3.14"
pip = ">=25.2,<26"
pre-commit = ">=4.3.0,<5"
typing_extensions = ">=4.13.0"

[pypi-dependencies]
# Install the project itself in editable mode
athlete-management-system = { path = ".", editable = true }
keyring = ">=25.0"
garminconnect = ">=0.2.30, <0.3"
anthropic = ">=0.71.0, <0.72"
typing-extensions = ">=4.13.0"  # pydantic-core 2.33+ requires Sentinel which landed in 4.13
supabase = ">=2.15.0"
pydantic = ">=2.12, <3"
pydantic-settings = ">=2.0, <3"
ortools = ">=9.11, <10"
langchain = ">=1.0.0, <2"
langchain-anthropic = ">=1.0.0, <2"
langchain-core = ">=1.0.0, <2"
langgraph = ">=1.0.0, <2"
numpy = ">=2.3.4, <3"
pandas = ">=2.3.3, <3"
plotly = ">=6.3.1, <7"
python-dotenv = ">=1.1.1, <2"
setuptools = "*"
pytest = ">=8.4.2, <9"
pytest-cov = ">=7.0.0, <8"
pytest-asyncio = ">=1.2.0, <2"
mypy = ">=1.18.2, <2"
ruff = ">=0.14.1, <0.15"
vulture = ">=2.14, <3"
types-PyYAML = "*"
types-requests = "*"

[tasks]
# Development tasks
dev = "python cli/ams.py --help"
test = "pytest"
test-cov = "pytest --cov=. --cov-report=term-missing --cov-report=html"
lint-ruff = "ruff check ."
ruff-fix = "ruff check --fix ."
type-check = "mypy ."

# Dead code detection
dead-code = "vulture services cli core --min-confidence 80"
dead-code-all = "vulture services cli core --min-confidence 60"
dead-code-verbose = "vulture services cli core --min-confidence 80 --verbose"

# CLI coach interface
coach-cli = "python cli/ams.py"
coach-init = "python cli/ams.py --init-config"

[environments]
default = { solve-group = "default" }
