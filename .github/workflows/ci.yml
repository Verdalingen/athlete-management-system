name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.41.4

      # Non-blocking for now: pre-existing debt (ruff/mypy) predates this workflow.
      # Tighten to blocking once the backlog is paid down.
      - name: Lint (ruff)
        run: pixi run lint-ruff
        continue-on-error: true

      - name: Type check (mypy)
        run: pixi run type-check
        continue-on-error: true

      - name: Test
        run: pixi run test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: pre-existing debt predates this workflow.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
